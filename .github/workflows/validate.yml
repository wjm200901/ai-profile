name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 01:00 UTC，用来发现过期事实（as_of 太久没更新的文件会报警告）
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate profile
        run: python scripts/validate.py

      - name: Build context pack
        run: python scripts/build.py
